[package]
publish = false
name = "fw"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Heap use is confined to the unexecuted stack compatibility probe.
link-proof = []

[[bin]]
name = "fw"
path = "src/main.rs"
test = false
bench = false

[dependencies]
x3-core = { workspace = true, features = ["fat"] }
x3-proto.workspace = true

[target.'cfg(target_os = "none")'.dependencies]
esp-hal = { version = "=1.1.2", features = ["esp32c3", "unstable"] }
esp-radio = { version = "=0.18.0", features = ["esp32c3", "wifi"] }
esp-rtos = { version = "=0.3.0", features = ["esp32c3", "esp-radio", "esp-alloc", "embassy"] }
esp-alloc = { version = "=0.10.0", features = ["esp32c3"] }
embassy-executor = { version = "=0.10.0" }
embassy-net = { version = "=0.9.1", features = ["tcp", "udp", "dns", "proto-ipv4", "dhcpv4", "medium-ethernet"] }
embedded-sdmmc = { version = "=0.10.0", default-features = false }
esp-bootloader-esp-idf = { version = "=0.5.0", features = ["esp32c3"] }
esp-storage = { version = "=0.9.0", features = ["esp32c3"] }
embedded-storage = { version = "=0.3.2" }
embedded-hal = { version = "=1.0.0" }
embedded-tls = { version = "=0.19.0", default-features = false }
rand_core = { version = "=0.6.4", default-features = false }
embassy-futures = { version = "=0.1.2" }
embassy-time = { version = "=0.5.1" }
