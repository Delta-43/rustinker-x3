# cargo-deny policy. Run: cargo deny check
# Licences: permissive only, plus MPL-2.0 (cssparser, selectors and friends, used
# unmodified by the companion only) and CDLA-Permissive-2.0 (root certificate
# data, companion only). The device firmware's dependencies are all permissive.
[graph]
targets = [
    "riscv32imc-unknown-none-elf",
    "x86_64-unknown-linux-gnu",
]

[advisories]
version = 2
yanked = "deny"
# Each ignore says why it does not apply. Review them when dependencies change.
ignore = [
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 via p256/p384 via jsonwebtoken, companion only. Timing variability in operations on secret values. The companion only verifies RS256 tokens with Cloudflare's public keys (the algorithm is pinned); it holds no private key and never uses ECDSA. No compatible fix: the RustCrypto stack pins 0.5." },
    { id = "RUSTSEC-2023-0071", reason = "Marvin attack on RSA private-key operations (rsa via jsonwebtoken, companion only). We only verify signatures with a public key. There is no patched release." },
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained, not vulnerable. A build-time macro crate used by the ESP HAL stack." },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained, not vulnerable. Build-time only, through esp-config; not in the firmware image." },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained, not vulnerable. Used by the host-only font tool (fontdue) to rasterise the bundled Literata; never on the device or the companion." },
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
